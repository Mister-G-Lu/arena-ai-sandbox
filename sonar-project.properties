# SonarQube/SonarCloud project configuration.
# The CI template runs this scan when SONAR_HOST_URL and SONAR_TOKEN are configured.
sonar.projectKey=Mister-G-Lu_arena-ai-sandbox
sonar.projectName=arena-ai-sandbox
sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx,src/**/*.test.ts,src/**/*.test.tsx,src/content/**,src/assets/**,docs/**,coverage/**,node_modules/**
sonar.coverage.exclusions=src/**/*.test.*,src/test/**,src/**/__tests__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.cpd.exclusions=src/**/*.test.*,src/content/**
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
